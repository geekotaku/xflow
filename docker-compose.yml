services:
  xflow:
    build: .
    image: ghcr.io/geekotaku/xflow:latest
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_PATH: /data/xflow.db
      # ADMIN_PASSWORD: ""                   # optional, sets or resets admin password (can be commented out after setup)
      # ADMIN_USERNAME: "admin"              # optional, admin username (defaults to admin)
      # TZ: "Asia/Shanghai"                   # optional, container timezone (only used by scheduled tasks, e.g. daily 02:00 AM DB maintenance)
      # FLOW_DEFAULT_TOTAL: "1099511627776"  # optional, bytes, defaults to 1TB
      # RETENTION_DAYS: "90"                  # optional, defaults to 90 days (3 months), 0 to disable
      # AGGREGATION_DAYS: "3"                 # optional, defaults to 3 days (compacts older raw reports into 1h summaries)
      # PROFILE_UPDATE_INTERVAL: "24"         # optional, hours for client subscription auto-update (defaults to 24)
      # PROFILE_WEB_PAGE_URL: ""             # optional, dashboard url for client profile (e.g. https://flow.example.com)
    volumes:
      - xflow-data:/data
    restart: unless-stopped

volumes:
  xflow-data:
