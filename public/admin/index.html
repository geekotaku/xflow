<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>xflow · Node Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 8px;
    --radius-sm: 6px;

    /* Light */
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface-2: #f0f1f5;
    --border: #e2e4eb;
    --text: #1a1d2e;
    --text-muted: #6b7080;
    --accent: #5b7cf6;
    --accent-hover: #4568e8;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --shadow: 0 2px 12px rgba(0,0,0,.08);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --surface: #1a1d2e;
      --surface-2: #242736;
      --border: #2e3148;
      --text: #e8eaf6;
      --text-muted: #8b90a8;
      --accent: #6b8bff;
      --accent-hover: #8ca4ff;
      --danger: #f87171;
      --danger-hover: #ef4444;
      --shadow: 0 2px 20px rgba(0,0,0,.4);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    transition: background .25s, color .25s;
  }

  .page-wrap {
    max-width: 960px;
    margin-inline: auto;
    padding: 28px 24px 48px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .header-left h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -.3px;
  }

  .header-left p {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0;
  }

  .nav-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    transition: all .15s;
  }
  .nav-link:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 24px;
  }

  form {
    display: flex;
    gap: 10px;
  }

  input {
    flex: 1;
    padding: 8px 12px;
    font-size: 14px;
    font-family: var(--font);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  input:focus {
    border-color: var(--accent);
  }

  .btn {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font);
    border-radius: var(--radius-sm);
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: all .15s;
  }
  .btn:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  th {
    color: var(--text-muted);
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  tbody tr:hover td {
    background: var(--surface-2);
  }

  code {
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    background: var(--surface-2);
    padding: 3px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    word-break: break-all;
  }

  .actions {
    display: flex;
    gap: 6px;
  }

  .action-btn {
    padding: 4px 9px;
    font-size: 12px;
    font-family: var(--font);
    font-weight: 500;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    transition: all .15s;
  }
  .action-btn:hover {
    background: var(--border);
  }
  .action-btn.danger {
    color: var(--danger);
    border-color: rgba(239, 68, 68, 0.3);
  }
  .action-btn.danger:hover {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── Responsive ─────────────────────────────────────────────── */
  .table-wrap {
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  th, td {
    white-space: nowrap;
  }

  @media (max-width: 640px) {
    .page-wrap {
      padding: 14px 10px 48px;
    }
    .header {
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 16px;
      gap: 12px;
    }
    .header-left h1 {
      font-size: 20px;
    }
    .header-left p {
      font-size: 12px;
    }
    .nav-link {
      width: 100%;
      justify-content: center;
      padding: 8px 12px;
    }
    .card {
      padding: 14px 12px;
      margin-bottom: 14px;
      border-radius: 10px;
    }
    form {
      flex-direction: column;
      gap: 8px;
    }
    input {
      width: 100%;
      padding: 9px 10px;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      padding: 9px 14px;
      font-size: 14px;
    }
    .table-wrap table {
      min-width: 480px;
    }
  }
</style>
</head>
<body>
<div class="page-wrap">

  <div class="header">
    <div class="header-left">
      <h1>Node / Token Management</h1>
      <p>Manage node endpoints and authentication tokens for reporting agents</p>
    </div>
    <a href="/" class="nav-link">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6" />
      </svg>
      Dashboard
    </a>
  </div>

  <div class="card">
    <form id="createForm">
      <input id="nameInput" placeholder="Node name, e.g. hk-node-01" required />
      <button type="submit" class="btn">Create Node</button>
    </form>
  </div>

  <div class="card" style="padding: 0; overflow: hidden;">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Token</th>
            <th>Created At</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="nodeTable"></tbody>
      </table>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
