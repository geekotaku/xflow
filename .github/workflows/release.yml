name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Tag Version
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # 1. Build & Package xflow Server
      - name: Build & Package xflow Server
        run: |
          npm ci
          npm run build
          VERSION="${{ steps.version.outputs.version }}"
          # Create archive with prebuilt dist, frontend static assets, configs and scripts
          tar -czf "xflow-${VERSION}.tar.gz" \
            dist/ \
            public/ \
            package.json \
            package-lock.json \
            docker-compose.yml \
            Dockerfile \
            install.sh \
            install-agent.sh \
            CHANGELOG.md \
            README.md \
            LICENSE

      # 2. Build & Package xflow-agent Standalone Binaries (amd64 & arm64)
      - name: Build & Package xflow-agent binaries
        run: |
          cd agent
          npm ci
          # 1. Bundle and prepare SEA blob
          npx esbuild src/index.ts --bundle --platform=node --target=node22 --outfile=dist/bundle.js
          node --experimental-sea-config sea-config.json

          # 2. Build linux-amd64 binary
          cp "$(which node)" ../xflow-agent-linux-amd64
          npx postject ../xflow-agent-linux-amd64 NODE_SEA_BLOB dist/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x ../xflow-agent-linux-amd64

          # 3. Build linux-arm64 binary
          NODE_VERSION="$(node -v)"
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-arm64.tar.gz" -o /tmp/node-arm64.tar.gz
          tar -xzf /tmp/node-arm64.tar.gz --strip-components=2 -C /tmp "node-${NODE_VERSION}-linux-arm64/bin/node"
          mv /tmp/node ../xflow-agent-linux-arm64
          rm -f /tmp/node-arm64.tar.gz
          npx postject ../xflow-agent-linux-arm64 NODE_SEA_BLOB dist/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          chmod +x ../xflow-agent-linux-arm64

      # 3. Generate Release Notes from CHANGELOG.md
      - name: Generate Release Body from CHANGELOG.md
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node .github/scripts/generate-release-notes.js

      # 4. Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: RELEASE_BODY.md
          files: |
            xflow-${{ steps.version.outputs.version }}.tar.gz
            xflow-agent-linux-amd64
            xflow-agent-linux-arm64
