name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Tag Version
        id: version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # 1. Build & Package xflow Server
      - name: Build & Package xflow Server
        run: |
          npm ci
          npm run build
          VERSION="${{ steps.version.outputs.version }}"
          # Create archive with prebuilt dist, frontend static assets, configs and scripts
          tar -czf "xflow-${VERSION}.tar.gz" \
            dist/ \
            public/ \
            package.json \
            package-lock.json \
            docker-compose.yml \
            Dockerfile \
            install.sh \
            CHANGELOG.md \
            README.md \
            LICENSE

      # 2. Build & Package xflow-agent
      - name: Build & Package xflow-agent
        run: |
          cd agent
          npm ci
          npm run build
          VERSION="${{ steps.version.outputs.version }}"
          # Create archive with prebuilt agent dist, proto files, configs and scripts
          tar -czf "../xflow-agent-${VERSION}.tar.gz" \
            dist/ \
            proto/ \
            package.json \
            package-lock.json \
            docker-compose.yml \
            Dockerfile \
            install.sh \
            README.md

      # 3. Generate Release Notes from CHANGELOG.md
      - name: Generate Release Body from CHANGELOG.md
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node .github/scripts/generate-release-notes.js

      # 4. Publish GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: RELEASE_BODY.md
          files: |
            xflow-${{ steps.version.outputs.version }}.tar.gz
            xflow-agent-${{ steps.version.outputs.version }}.tar.gz
